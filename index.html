<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Washed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0E17">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Washed - Registro de entrenamientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="copper">
<div id="app">
  <header>
    <div class="logo">WASH<span>ED</span></div>
    <div class="header-right">
      <div class="today" id="todayLabel"></div>
      <button class="btn-icon" id="themeBtn" title="Cambiar color" style="width:28px; height:28px; font-size:13px;">🎨</button>
    </div>
  </header>

  <main id="main">
    <div class="skeleton-block" style="height:70px; margin-bottom:16px;"></div>
    <div class="skeleton-block" style="height:130px; margin-bottom:14px;"></div>
    <div class="skeleton-block" style="height:130px; margin-bottom:14px;"></div>
  </main>

  <nav>
    <button data-tab="train" class="active">
      <svg viewBox="0 0 24 24"><path d="M20.5 14.3l-3.3-3.3c.4-1 .2-2.2-.6-3l-3-3c-.8-.8-2-1-3-.6L14 6.7c.3.1.5.3.7.5l3 3c.2.2.4.4.5.7l2.3-1.6zm-13.8-8.2l3.3 3.3c-.4 1-.2 2.2.6 3l3 3c.8.8 2 1 3 .6L10 17.3c-.3-.1-.5-.3-.7-.5l-3-3c-.2-.2-.4-.4-.5-.7l-2.3 1.6zM2 13h2v7H2v-7zm20-3h-2V3h2v7zM4 6.5C4 5.7 4.7 5 5.5 5h3C9.3 5 10 5.7 10 6.5v2C10 9.3 9.3 10 8.5 10h-3C4.7 10 4 9.3 4 8.5v-2z"/></svg>
      Entrenar
    </button>
    <button data-tab="routines">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      Rutinas
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.92 8.92 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      Historial
    </button>
    <button data-tab="prs">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      Récords
    </button>
    <button data-tab="progress">
      <svg viewBox="0 0 24 24"><path d="M3.5 18.5l6-6 4 4L20.5 9 22 10.5 13.5 19l-4-4-4.5 4.5zM3 5h18v2H3z"/></svg>
      Progreso
    </button>
  </nav>
</div>

<script src="app.js"></script>
</body>
</html>
